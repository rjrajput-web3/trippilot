<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TripPilot — Simulated Alexa+ Experience</title>
<style>
  :root { --bg:#0f1620; --panel:#182233; --accent:#38bdf8; --accent2:#a78bfa; --text:#e8eef6; --muted:#8fa3bd; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text);
         display:flex; flex-direction:column; height:100vh; }
  header { padding:16px 20px; background:linear-gradient(90deg,#0ea5e9,#8b5cf6); }
  header h1 { margin:0; font-size:20px; }
  header p { margin:4px 0 0; font-size:13px; opacity:.9; }
  #chat { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:12px; max-width:820px; width:100%; margin:0 auto; }
  .msg { max-width:85%; padding:12px 16px; border-radius:16px; white-space:pre-wrap; font-size:14.5px; line-height:1.55; }
  .user { align-self:flex-end; background:#2563eb; border-bottom-right-radius:4px; }
  .bot { align-self:flex-start; background:var(--panel); border-bottom-left-radius:4px; border:1px solid #24344d; }
  .typing { color:var(--muted); font-style:italic; }
  #bar { display:flex; gap:10px; padding:14px 20px; max-width:820px; width:100%; margin:0 auto; }
  #input { flex:1; padding:13px 16px; border-radius:24px; border:1px solid #24344d; background:var(--panel); color:var(--text); font-size:15px; outline:none; }
  #input:focus { border-color:var(--accent); }
  button { padding:13px 22px; border-radius:24px; border:none; background:var(--accent); color:#04222f; font-weight:700; font-size:15px; cursor:pointer; }
  button:hover { filter:brightness(1.1); }
  .samples { display:flex; flex-wrap:wrap; gap:8px; padding:0 20px 14px; max-width:820px; width:100%; margin:0 auto; }
  .samples button { background:var(--panel); color:var(--accent); border:1px solid #24344d; font-size:12.5px; padding:8px 14px; font-weight:500; }
  footer { text-align:center; color:var(--muted); font-size:11.5px; padding:8px; }
</style>
</head>
<body>
<header>
  <h1>✈️ TripPilot</h1>
  <p>Simulated Alexa+ experience — travel-concierge Agent Skill powered by the TripPilot MCP server</p>
</header>
<div id="chat"></div>
<div class="samples">
  <button data-q="plan a trip to Goa from 2026-11-05 to 2026-11-09, budget 800, likes beach food">Plan a Goa trip</button>
  <button data-q="weather in Tokyo from 2026-10-20 to 2026-10-23">Tokyo weather</button>
  <button data-q="convert 500 USD to EUR">Convert currency</button>
  <button data-q="my trips">My trips</button>
</div>
<div id="bar">
  <input id="input" placeholder="Ask TripPilot… e.g. plan a trip to Paris from 2026-12-01 to 2026-12-05, budget 1500, likes culture food" autocomplete="off">
  <button id="send">Send</button>
</div>
<footer>Demo only — drives the same tools as the TripPilot MCP server. Data: Open-Meteo + Frankfurter (free, no keys).</footer>
<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
function addMsg(text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}
async function send(text) {
  const q = (text ?? input.value).trim();
  if (!q) return;
  addMsg(q, 'user');
  input.value = '';
  const t = addMsg('TripPilot is thinking…', 'bot typing');
  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: q})
    });
    const data = await r.json();
    t.classList.remove('typing');
    t.textContent = data.reply;
  } catch (e) {
    t.classList.remove('typing');
    t.textContent = 'Connection error — is the demo server running?';
  }
  chat.scrollTop = chat.scrollHeight;
}
document.getElementById('send').onclick = () => send();
input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
document.querySelectorAll('.samples button').forEach(b => b.onclick = () => send(b.dataset.q));
addMsg("Hello! I'm TripPilot, your travel concierge. I can plan full trips with live weather and currency conversion, remember them, and brief you anytime. Try a sample below — or type “help”.", 'bot');
</script>
</body>
</html>
